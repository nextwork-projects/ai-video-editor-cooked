:root[data-theme=dark]{--bg:#100E0E;--panel:#161413;--ink:#F2F0EB;--t2:rgba(242,240,235,.80);--t3:rgba(242,240,235,.58);--t4:rgba(242,240,235,.42);

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/20px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ink);text-decoration:underline 1px;text-underline-offset:3px}
.app{display:flex;min-height:100vh}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}

.col{display:flex;flex-direction:column;flex-shrink:0}

.grid{display:flex;flex-wrap:wrap;gap:16px 12px}

/* ---- the app shell (Paper "P App: main"): a labelled sidebar, or the icon rail when collapsed or narrow ---- */

.rl-pan{width:40px;height:40px;border-radius:10px!important;background:var(--tile)!important;color:var(--ink);border:1px solid var(--line)!important;display:grid;place-items:center;flex-shrink:0}

/* components: one primary and one secondary button, small sizes, the ⋯ on a picture, the menu */
.b1,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-size:14px;line-height:18px;font-weight:600;white-space:nowrap;flex-shrink:0;text-decoration:none}

/* page heads and sections */

/* video cards: one layout for every video, tall or wide. A grid of equal columns, every card in a row the same
   height: the picture area (one height), title, meta, status, then the button pinned to the bottom at full width,
   so the buttons in a row line up. The status bar runs along the bottom (green and full when done, black while made). */
.vcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:stretch}
.vc{min-width:0;cursor:pointer}.vc.dragsrc,.dt.dragsrc{opacity:.45}

// ---------------------------------------------------------------- render loop
// The poll redraws every 1.5 s. Same HTML: the DOM is left alone. New HTML on the same view: every inner
// scroller (a column, panel or list) gets its scroll back, found again by its place in the tree.
// A clock's text (data-since) is left out of the comparison: the 1 s timer keeps it current, so a ticking
// clock never rebuilds the view under the pointer (a click that lands on a replaced card is lost).
const still=h=>h.replace(/(data-since="[^"]*"[^>]*>)[^<]*/g,'$1');
// New HTML on the same view is patched into the page, not swapped in: a node whose tag and place match keeps its
// identity and only its changed attributes and text are written, so a button under the pointer is never replaced
// (a poll every 1.5 s used to rebuild Make my video and Download mid-click). A form field whose markup changed is
// replaced whole, as before, so a value the code reset shows. While a button is held down nothing is painted;
// the paint waits for the click.
const KEEPC=new Set(['wd','vplay','flash','dragsrc','over']);   // classes the page adds after a paint (a wide picture, a playing card, a drop target)
function morph(a,b){   // make a's children match b's
  const A=[...a.childNodes],B=[...b.childNodes];
  for(let i=0;i<B.length;i++){
    const x=A[i],y=B[i];
    if(!x){a.appendChild(y);continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&(x.id!==y.id||/^(INPUT|TEXTAREA|SELECT|VIDEO)$/.test(x.nodeName)&&x.outerHTML!==y.outerHTML))){a.replaceChild(y,x);continue}
    if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
    for(const at of [...y.attributes]){let v=at.value;if(at.name==='class')v=[v,...[...x.classList].filter(c=>KEEPC.has(c))].join(' ').trim();if(x.getAttribute(at.name)!==v)x.setAttribute(at.name,v)}
    morph(x,y);
  }
  for(let i=A.length-1;i>=B.length;i--)if(A[i].parentNode===a)a.removeChild(A[i]);
}

addEventListener('pointerdown',()=>{held=Date.now()},true);
addEventListener('pointerup',()=>{held=0},true);   // the click follows in the same task: no poll can land between them
addEventListener('pointercancel',()=>{held=0},true);
function paint(el,h,view){
  if(el._h!=null&&still(el._h)===still(h)&&el._v===view)return;
  if(held&&Date.now()-held<3000&&el._v===view&&el._h!=null){clearTimeout(paint.t);paint.t=setTimeout(()=>render(),60);return}
  const keep=[];
  if(el._v===view)(function walk(e,path){if(e.scrollTop||e.scrollLeft)keep.push([path,e.scrollTop,e.scrollLeft]);[...e.children].forEach((c,i)=>walk(c,[...path,i]))})(el,[]);
  if(el._v===view&&el._h!=null){for(const m of [...($('#menus')||{children:[]}).children])if(m._root===el)m.remove();const t=document.createElement('div');t.innerHTML=h;morph(el,t)}
  else el.innerHTML=h;
  el._h=h;el._v=view;
  for(const [path,t,l] of keep){const e=path.reduce((x,i)=>x&&x.children[i],el);if(e){e.scrollTop=t;e.scrollLeft=l}}
  placeMenus(el);tickClocks();
}
// Every open ⋯ menu lives in one top layer (#menus, position fixed) so no card, filter or overflow can cover
// or clip it: placed under its button, flipped left or up to stay in the window. A poll that repaints the
// same view puts it back in the same place.
function placeMenus(root){
  const layer=$('#menus');if(!layer||root===layer)return;
  for(const m of [...layer.children])if(m._root===root)m.remove();
  for(const m of root.querySelectorAll('.cmenu:not(.sub)')){
    const b=m.previousElementSibling&&m.previousElementSibling.matches('button')?m.previousElementSibling:m.parentElement.querySelector('.dots,.more2')||m.parentElement;
    m._root=root;m._btn=b;layer.appendChild(m);m.classList.add('top');placeMenu(m);
  }
}
function placeMenu(m){
  const r=m._btn.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;let x=r.left,y=r.bottom+4;
  if(x+w>innerWidth-8)x=Math.max(8,r.right-w);if(y+h>innerHeight-8)y=Math.max(8,r.top-h-4);
  m.style.left=x+'px';m.style.top=y+'px';
  const sub=m.querySelector('.cmenu.sub');m.classList.toggle('subflip',!!sub&&x+w+6+sub.offsetWidth>innerWidth-8);
  return r.bottom>0&&r.top<innerHeight;
}
function tickClocks(){for(const e of document.querySelectorAll('[data-since]')){const t=+e.dataset.since,x=Math.max(0,Math.round(Date.now()/1000-t));if(t)e.textContent=e.dataset.f?fmtT(x):secs(x)}}
function render(){
  if(!S||DRAG)return;   // a card is being dragged: a redraw would drop it
  const keep=document.activeElement&&document.activeElement.id,pos=keep&&document.activeElement.selectionStart,end=keep&&document.activeElement.selectionEnd,val=keep&&document.activeElement.value;
  if(!inApp())return;   // the library is still loading
  document.body.classList.toggle('rh',true);paintSide();
  if(!rv||rv==='making')rv=L.videos.length||firstRun()?'home':'new';
  rrender();
  const ji=jobInfo(),tt=ji?`${ji.label} · cooked.`:'cooked.';if(document.title!==tt&&!document.documentElement.dataset.ask)document.title=tt;
  if(keep){const e=document.getElementById(keep);if(e&&'value' in e&&!e.matches(':focus')){if(e.type!=='file')e.value=val;e.focus();try{e.setSelectionRange(pos,end??pos)}catch(x){}}}
}
setInterval(tickClocks,1000);
addEventListener('resize',()=>render());
async function load(){
  try{const r=await fetch('/state');if(!r.ok)throw 0;S=await r.json();if(S.listening)ui.connect=null;if(Date.now()-themeAt>3000)applyTheme(S.theme)}catch(e){const uj=latest('update');if(uj&&uj.state==='done'&&Date.now()/1000-(uj.finished||0)<60){if(!ui.rst){ui.rst=1;toast('Restarting on the new version...')}return}const lv=$('#live');lv.className='live';lv.style.width='auto';lv.style.maxWidth='520px';lv.style.whiteSpace='normal';lv.textContent='The editor stopped. Run nextwork-editor to start it again.';return}
  // live reload: a new page version (home.html, ask.js or the Python changed) reloads this tab, keeping the view
  if(S.page){if(PV&&S.page!==PV&&canReload()){keepView();location.reload();return}PV=PV||S.page}
  // typing in a key box: do not redraw under the cursor
  const a=document.activeElement;if(a&&a.id&&a.id.startsWith('k-')&&a.value)return paintSide();
  if(a&&a.type==='range'||ui.spdrag||DRAG)return;   // dragging a slider, the caption or a card: do not redraw under the hand   // dragging a slider or the caption: do not redraw under the hand
  if(!L)await loadLib();
  if(rv==='stylepage')await loadStyle();
  await loadClaudes();
  render();
  if(keepY!=null){window.scrollTo(0,keepY);keepY=null}
}
let PV=null,keepY=null;
const canReload=()=>{const a=document.activeElement;return !(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.value)&&!nv.up.some(u=>!u.bad)&&!ui.edit};
function keepView(){try{sessionStorage.setItem('ave-home-keep',JSON.stringify({rv,sp:ui.sp,y:scrollY,nv:{sel:nv.sel,style:nv.style,aspect:nv.aspect,aspectSet:nv.aspectSet,join:nv.join}}))}catch(e){}}
try{const k=JSON.parse(sessionStorage.getItem('ave-home-keep')||'null');sessionStorage.removeItem('ave-home-keep');if(k){rv=k.rv;ui.sp=k.sp;Object.assign(nv,k.nv);keepY=k.y}}catch(e){}
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
load().then(loadRecent).then(loadBroll);setInterval(load,1500);setInterval(loadLib,4000);
</script>
